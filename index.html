<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Narith Tav</title>
</head>
<body>
<h1>Narith Tav</h1>
<ul id="file-list"></ul>

<script>
const OWNER = "narith-tav";
const REPO = "narith-tav.github.io";

function toDisplayName(name) {
  return name
    .replace(/\.html$/, "")
    .replace(/[-_]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// 1. Récupère la branche par défaut, puis l'arbre complet du repo (récursif en un seul appel)
fetch(`https://api.github.com/repos/${OWNER}/${REPO}`)
  .then(res => res.json())
  .then(repoInfo => {
    const branch = repoInfo.default_branch;
    return fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${branch}?recursive=1`);
  })
  .then(res => res.json())
  .then(tree => {
    const list = document.getElementById("file-list");

    const htmlFiles = tree.tree
      .filter(item => item.type === "blob" && item.path.endsWith(".html") && item.path !== "index.html")
      .sort((a, b) => a.path.localeCompare(b.path));

    // Regroupe les fichiers par dossier ("" = racine)
    const groups = {};
    htmlFiles.forEach(item => {
      const parts = item.path.split("/");
      const filename = parts.pop();
      const folder = parts.join("/"); // "" si à la racine
      if (!groups[folder]) groups[folder] = [];
      groups[folder].push({ path: item.path, filename });
    });

    const folderNames = Object.keys(groups).filter(f => f !== "").sort();

    // 1. Fichiers à la racine : liste simple à puces
    (groups[""] || []).forEach(({ path, filename }) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = path;
      a.textContent = toDisplayName(filename);
      li.appendChild(a);
      list.appendChild(li);
    });

    // 2. Chaque répertoire : titre numéroté, puis sous-liste indentée à puces
    folderNames.forEach((folder, index) => {
      const folderLi = document.createElement("li");
      folderLi.style.listStyle = "none";
      folderLi.style.marginTop = "0.8em";

      const heading = document.createElement("strong");
      heading.textContent = `${index + 1}. ${toDisplayName(folder.replace(/\//g, " / "))}`;
      folderLi.appendChild(heading);

      const subList = document.createElement("ul");
      groups[folder].forEach(({ path, filename }) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = path;
        a.textContent = toDisplayName(filename);
        li.appendChild(a);
        subList.appendChild(li);
      });
      folderLi.appendChild(subList);

      list.appendChild(folderLi);
    });
  })
  .catch(err => console.error("Erreur GitHub API :", err));
</script>
</body>
</html>
