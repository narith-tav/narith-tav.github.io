<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Narith Tav</title>
</head>
<body>
<h1>Narith Tav</h1>
<ul id="file-list"></ul>

<script>
const OWNER = "narith-tav";
const REPO = "narith-tav.github.io";

function toDisplayName(name) {
  return name
    .replace(/\.html$/, "")
    .replace(/[-_]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// 1. Récupère la branche par défaut, puis l'arbre complet du repo (récursif en un seul appel)
fetch(`https://api.github.com/repos/${OWNER}/${REPO}`)
  .then(res => res.json())
  .then(repoInfo => {
    const branch = repoInfo.default_branch;
    return fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${branch}?recursive=1`);
  })
  .then(res => res.json())
  .then(tree => {
    const list = document.getElementById("file-list");

    const htmlFiles = tree.tree
      .filter(item => item.type === "blob" && item.path.endsWith(".html") && item.path !== "index.html")
      .sort((a, b) => a.path.localeCompare(b.path));

    // Construit un arbre { files: [...], children: { nom: { files, children } } }
    const root = { files: [], children: {} };
    htmlFiles.forEach(item => {
      const parts = item.path.split("/");
      const filename = parts.pop();
      let node = root;
      parts.forEach(folderName => {
        if (!node.children[folderName]) {
          node.children[folderName] = { files: [], children: {} };
        }
        node = node.children[folderName];
      });
      node.files.push({ path: item.path, filename });
    });

    function renderNode(node, container, depth) {
      // Fichiers de ce niveau : liste à puces
      node.files
        .sort((a, b) => a.filename.localeCompare(b.filename))
        .forEach(({ path, filename }) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = path;
          a.textContent = toDisplayName(filename);
          li.appendChild(a);
          container.appendChild(li);
        });

      // Sous-répertoires : titre en gras + sous-liste indentée (bullets et retrait gérés nativement par l'imbrication de <ul>)
      Object.keys(node.children).sort().forEach((folderName) => {
        const folderLi = document.createElement("li");
        folderLi.style.marginTop = depth === 0 ? "0.8em" : "0.4em";

        const heading = document.createElement("strong");
        heading.textContent = toDisplayName(folderName);
        folderLi.appendChild(heading);

        const subList = document.createElement("ul");
        renderNode(node.children[folderName], subList, depth + 1);
        folderLi.appendChild(subList);

        container.appendChild(folderLi);
      });
    }

    renderNode(root, list, 0);
  })
  .catch(err => console.error("Erreur GitHub API :", err));
</script>
</body>
</html>
